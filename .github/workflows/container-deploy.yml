name: Deploy to ECS

on:
  push:
    branches: [main]
    paths:
      - '04-containers/app/**'
      - '.github/workflows/container-deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: stage4-app
  IMAGE_BASE: 010429757460.dkr.ecr.us-east-1.amazonaws.com/stage4-app
  CONTAINER_NAME: app

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      ECS_CLUSTER: stage4-cluster
      ECS_SERVICE: stage4-service
      FRONT_DOOR: stage4 front door
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::010429757460:role/stage4-deploy-staging
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build --platform linux/amd64 -t $IMAGE_BASE:${{ github.sha }} ./04-containers/app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_BASE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        run: |
          if aws ecr describe-images --repository-name $ECR_REPOSITORY \
               --image-ids imageTag=${{ github.sha }} > /dev/null 2>&1; then
            echo "Image tag already exists, skipping push"
          else
            docker push $IMAGE_BASE:${{ github.sha }}
          fi

      - name: Record running task definition
        id: previous
        run: |
          PREV=$(aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE \
            --query 'services[0].taskDefinition' --output text)
          echo "arn=$PREV" >> $GITHUB_OUTPUT

      - name: Download running task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ steps.previous.outputs.arn }} \
            --query taskDefinition > task-def.json

      - name: Render task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_BASE }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Smoke test through CloudFront
        run: |
          DOMAIN=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='$FRONT_DOOR'].DomainName | [0]" \
            --output text)
          URL=https://$DOMAIN
          for i in $(seq 1 12); do
            if curl -fsS $URL/health | grep -q healthy && curl -fsS -o /dev/null $URL/; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Not ready yet, retrying..."
            sleep 10
          done
          echo "Smoke test failed"
          exit 1

      - name: Roll back on failure
        if: failure() && steps.previous.outputs.arn != ''
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE \
            --task-definition ${{ steps.previous.outputs.arn }} > /dev/null
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE
          echo "Rolled back to ${{ steps.previous.outputs.arn }}"

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    env:
      ECS_CLUSTER: stage4-prod-cluster
      ECS_SERVICE: stage4-prod-service
      FRONT_DOOR: stage4-prod front door
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::010429757460:role/stage4-deploy-production
          aws-region: ${{ env.AWS_REGION }}

      - name: Record running task definition
        id: previous
        run: |
          PREV=$(aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE \
            --query 'services[0].taskDefinition' --output text)
          echo "arn=$PREV" >> $GITHUB_OUTPUT

      - name: Download running task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ steps.previous.outputs.arn }} \
            --query taskDefinition > task-def.json

      - name: Render task definition with the staging-tested image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_BASE }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Smoke test through CloudFront
        run: |
          DOMAIN=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='$FRONT_DOOR'].DomainName | [0]" \
            --output text)
          URL=https://$DOMAIN
          for i in $(seq 1 12); do
            if curl -fsS $URL/health | grep -q healthy && curl -fsS -o /dev/null $URL/; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Not ready yet, retrying..."
            sleep 10
          done
          echo "Smoke test failed"
          exit 1

      - name: Roll back on failure
        if: failure() && steps.previous.outputs.arn != ''
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE \
            --task-definition ${{ steps.previous.outputs.arn }} > /dev/null
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE
          echo "Rolled back to ${{ steps.previous.outputs.arn }}"
