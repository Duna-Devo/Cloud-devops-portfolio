name: stage8-security

on:
  push:
    paths:
      - "08-security-capstone/**"
      - ".github/workflows/stage8-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov (Terraform scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: 08-security-capstone/terraform
          framework: terraform
          quiet: true

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
