image: python:3.12-slim

stages:
  - check
  - configure

before_script:
  - apt-get update -qq && apt-get install -y -qq openssh-client
  - pip install -q ansible
  - echo "$SSH_KEY_B64" | base64 -d > /tmp/stage7-key && chmod 600 /tmp/stage7-key

syntax-check:
  stage: check
  script:
    - ansible-playbook -i 07-server-configuration/ansible/inventory.ini 07-server-configuration/ansible/site.yml --syntax-check -e "zabbix_db_password=x"

configure-servers:
  stage: configure
  script:
    - ansible-playbook -i 07-server-configuration/ansible/inventory.ini 07-server-configuration/ansible/site.yml --private-key /tmp/stage7-key -e "zabbix_db_password=$ZABBIX_DB_PASSWORD"
